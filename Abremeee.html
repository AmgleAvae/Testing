<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Ti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fde047; /* Amarillo patito inicial */
            overflow: hidden; 
            touch-action: none; /* Evita que la pantalla se mueva por error en celulares */
            margin: 0;
            padding: 0;
            transition: background-color 1s ease;
        }

        /* Pantallas principales */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Cursor parpadeante para la máquina de escribir */
        .cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Botón escurridizo */
        #btn-yo {
            position: absolute;
            transition: top 0.15s ease-out, left 0.15s ease-out;
            z-index: 50;
        }

        /* Botón marrón inicial para transicionar */
        .btn-circular {
            width: 120px;
            height: 120px;
            background-color: #5c3a21;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn-circular:active { transform: scale(0.9); }

        /* Paisaje de fondo que aparece en el slide 3 */
        #landscape {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Cielo azul arriba, degradado a pasto verde abajo */
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 45%, #a3e635 45%, #4d7c0f 100%);
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 5;
            pointer-events: none;
        }

        /* Contenedor principal de girasoles */
        .flower-wrapper {
            position: absolute;
            transform: scale(0);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Se establece el tamaño base aquí, la escala dependerá de la profundidad (Y) */
        }

        /* Girasol realista (se rellena con SVG vía JS) */
        .flower-inner {
            width: 80px;
            height: 80px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            transform-origin: center;
        }

        /* Efecto vivo al hacer hover */
        .flower-inner:hover {
            transform: scale(1.15) rotate(15deg);
        }

        /* Animación para los corazones interactivos */
        .floating-heart {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            z-index: 9999;
            animation: heartFly 1.2s forwards ease-out;
        }

        @keyframes heartFly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }

        /* Marco estilo Polaroid limpio */
        .polaroid-container {
            position: absolute;
            z-index: 2000;
            background: white;
            /* Padding asimétrico para simular polaroid (más espacio abajo) */
            padding: 12px 12px 30px 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform: scale(0.5) rotate(-5deg);
            opacity: 0;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            /* Centrado perfecto */
            top: 50%;
            left: 50%;
            margin-top: -150px; /* Ajuste basado en la mitad de la altura aprox */
            margin-left: -125px; /* Ajuste basado en la mitad del ancho aprox */
        }

        .polaroid-container.show {
            transform: scale(1) rotate(2deg);
            opacity: 1;
            pointer-events: auto;
        }

        .polaroid-container img {
            display: block;
            width: 250px;
            height: 300px;
            object-fit: cover;
            border: 1px solid #e5e7eb;
        }

        /* Sol para darle un toque más de primavera */
        .sun {
            position: absolute;
            top: 10%;
            left: 80%;
            width: 80px;
            height: 80px;
            background-color: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 40px #facc15;
            z-index: 6;
            opacity: 0;
            transition: opacity 2s;
        }
    </style>
</head>
<body>

    <!-- AQUÍ PONES LA MÚSICA -->
    <!-- Reemplaza el src con la ruta o URL de tu canción romántica favorita -->
    <audio id="bg-music" loop>
        <source src="Audio.mp3.mp3" type="audio/mpeg">
    </audio>

    <!-- Paisaje de fondo (Oculto inicialmente) -->
    <div id="landscape">
        <div class="sun" id="sun"></div>
    </div>
    
    <!-- Contenedor donde crecerán los 150 girasoles -->
    <div id="flower-field" class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none overflow-hidden"></div>

    <!-- Pantalla 1: Pregunta inicial -->
    <div id="screen-1" class="screen active p-6 text-center">
        <h1 id="typewriter" class="text-3xl sm:text-4xl font-bold text-gray-800 leading-snug cursor min-h-[120px] max-w-md mx-auto relative z-10"></h1>
        
        <div id="buttons-container" class="opacity-0 transition-opacity duration-1000 mt-12 w-full max-w-md mx-auto relative h-24">
            <!-- Botón Yo (Móvil y escurridizo) -->
            <button id="btn-yo" class="bg-white text-gray-800 border-2 border-gray-300 font-bold py-3 px-8 rounded-full shadow-lg text-xl absolute left-1/4 transform -translate-x-1/2">
                Yo, obvio
            </button>
            <!-- Botón Tú (El correcto) -->
            <button id="btn-tu" class="bg-orange-400 hover:bg-orange-500 text-white border-2 border-orange-500 font-bold py-3 px-8 rounded-full shadow-lg text-xl absolute left-3/4 transform -translate-x-1/2 z-10">
                Tú, Andrés
            </button>
        </div>
    </div>

    <!-- Pantalla 2: Mensaje hermoso -->
    <div id="screen-2" class="screen p-6 text-center">
        <div class="max-w-md mx-auto bg-white/50 backdrop-blur-sm p-8 rounded-3xl shadow-xl flex flex-col items-center">
            <h2 class="text-4xl font-extrabold text-orange-600 mb-6 drop-shadow-md">Muy bieeeen.</h2>
            <p class="text-lg font-semibold text-gray-800 leading-relaxed mb-10 text-justify">
                El 21 de Septiembre marca el inicio de la primavera en este lado del mundo. Pero nunca existirá un campo de flores tan grande para hacer que pierda de vista lo maravillosa que <span class="text-orange-600 font-bold text-2xl">TÚ</span> te verías entre todas esas flores.
            </p>
            <button id="btn-start-magic" class="btn-circular">
                Presiona<br>aquí
            </button>
        </div>
    </div>

    <!-- Pantalla 3: La foto final estilo Polaroid -->
    <div id="polaroid" class="polaroid-container">
        <!-- ¡AQUÍ PONES LA FOTO DE ELLA! -->
        <!-- Reemplaza el enlace dentro de src="" con la foto de la persona maravillosa -->
        <img src="imagen_png.jpg" alt="La persona más maravillosa">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Variable para controlar que la música no intente reproducirse varias veces
            let musicaYaSonando = false;

            function intentarReproducirMusica() {
                if (!musicaYaSonando) {
                    const audio = document.getElementById('bg-music');
                    if (audio) {
                        // Intenta reproducir el audio
                        audio.play().then(() => {
                            musicaYaSonando = true;
                        }).catch((error) => {
                            console.log("El navegador requiere más interacción para reproducir el audio.");
                        });
                    }
                }
            }

            // Escucha cualquier clic o toque en toda la pantalla
            document.body.addEventListener('click', intentarReproducirMusica);
            document.body.addEventListener('touchstart', intentarReproducirMusica, {passive: true});

            // Referencias a los elementos del DOM
            const screen1 = document.getElementById('screen-1');
            const screen2 = document.getElementById('screen-2');
            const typewriterEl = document.getElementById('typewriter');
            const buttonsContainer = document.getElementById('buttons-container');
            const btnYo = document.getElementById('btn-yo');
            const btnTu = document.getElementById('btn-tu');
            const btnStartMagic = document.getElementById('btn-start-magic');
            const landscape = document.getElementById('landscape');
            const flowerField = document.getElementById('flower-field');
            const polaroid = document.getElementById('polaroid');
            const bgMusic = document.getElementById('bg-music');
            const sun = document.getElementById('sun');

            // 1. Efecto Máquina de Escribir
            const text = "Primero que nada:\n¿Quien es la persona más maravillosa del mundo?";
            let charIndex = 0;
            function typeWriter() {
                if (charIndex < text.length) {
                    typewriterEl.innerHTML += text.charAt(charIndex) === '\n' ? '<br>' : text.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, Math.random() * 50 + 40);
                } else {
                    typewriterEl.classList.remove('cursor');
                    buttonsContainer.classList.remove('opacity-0');
                    buttonsContainer.classList.add('opacity-100');
                }
            }
            setTimeout(typeWriter, 800);

            // 2. Lógica del Botón "Yo" que se escapa
            let isEscaping = false;
            function escapeButton(e) {
                // Previene el clic accidental en dispositivos táctiles
                if (e.type === 'touchstart') {
                    e.preventDefault(); 
                }
                
                // Cambiamos a position fixed para moverlo libremente por toda la pantalla
                if(!isEscaping) {
                    btnYo.style.position = 'fixed';
                    isEscaping = true;
                }

                const padding = 30; // Margen para que no se salga de la pantalla
                const maxX = window.innerWidth - btnYo.offsetWidth - padding;
                const maxY = window.innerHeight - btnYo.offsetHeight - padding;

                const randomX = Math.max(padding, Math.random() * maxX);
                const randomY = Math.max(padding, Math.random() * maxY);

                btnYo.style.left = `${randomX}px`;
                btnYo.style.top = `${randomY}px`;
                btnYo.style.transform = 'none'; // Resetea transformaciones previas de centrado
            }

            // Detectamos tanto el mouse como los dedos
            btnYo.addEventListener('mouseover', escapeButton);
            btnYo.addEventListener('touchstart', escapeButton, {passive: false});
            btnYo.addEventListener('click', escapeButton); // Por si logra darle clic

            // 3. Flujo principal
            btnTu.addEventListener('click', () => {
                // Asegurar que la música suene si no lo ha hecho ya
                intentarReproducirMusica();

                // Transición a la pantalla 2
                screen1.classList.remove('active');
                setTimeout(() => {
                    screen2.classList.add('active');
                }, 800);
            });

            btnStartMagic.addEventListener('click', () => {
                // Ocultar pantalla 2
                screen2.classList.remove('active');
                
                // Mostrar paisaje natural (cielo, sol y pasto)
                setTimeout(() => {
                    landscape.style.opacity = '1';
                    sun.style.opacity = '1';
                }, 500);

                // Plantar el campo de girasoles
                setTimeout(() => {
                    plantSunflowers();
                }, 1000);
            });

            // Código para un girasol realista en formato SVG para usar como Background
            // Esto es mucho más eficiente y bonito que usar divs puros o cargar imágenes externas
            const sunflowerSVG = `
                <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
                    <g transform='translate(50,50)'>
                        <!-- Capa trasera de pétalos -->
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(15)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(60)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(105)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(150)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(195)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(240)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(285)'/>
                        <path fill='#eab308' d='M0,0 C-10,-15 -18,-35 0,-45 C18,-35 10,-15 0,0' transform='rotate(330)'/>
                        
                        <!-- Capa frontal de pétalos principales amarillos -->
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(0)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(45)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(90)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(135)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(180)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(225)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(270)'/>
                        <path fill='#facc15' d='M0,0 C-12,-20 -22,-40 0,-50 C22,-40 12,-20 0,0' transform='rotate(315)'/>
                        
                        <!-- Centro del girasol (Semillas café) -->
                        <circle r='20' fill='#5c3a21'/>
                        <circle r='16' fill='#422006'/>
                        <circle r='10' fill='#291304'/>
                    </g>
                </svg>
            `;
            // Convertimos el SVG a formato usable por CSS background-image
            const encodedSVG = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(sunflowerSVG)}`;

            // Función para generar corazones cuando toca un girasol
            function spawnHeart(x, y) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.className = 'floating-heart';
                // Centrar el corazón en el punto del clic
                heart.style.left = `${x - 12}px`; 
                heart.style.top = `${y - 12}px`;
                document.body.appendChild(heart);

                // Remover el corazón del DOM después de que termine la animación
                setTimeout(() => {
                    heart.remove();
                }, 1200);
            }

            function plantSunflowers() {
                const totalFlowers = 150; // ¡Un campo enorme!
                
                for (let i = 0; i < totalFlowers; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'flower-wrapper';
                    
                    // x: 0 a 100vw, y: 45vh (horizonte) a 100vh (primer plano)
                    const x = Math.random() * 100;
                    const y = 45 + Math.random() * 55; 
                    
                    wrapper.style.left = `${x}vw`;
                    wrapper.style.top = `${y}vh`;
                    
                    // Ordenamiento 3D natural: Los que tienen Y mayor (más abajo) se dibujan por encima
                    wrapper.style.zIndex = Math.floor(y * 10);

                    // Escala por profundidad: Cerca del horizonte (y=45) son chiquitos (escala 0.3)
                    // En el primer plano (y=100) son enormes (escala 1.8)
                    const scaleFactor = 0.2 + ((y - 45) / 55) * 1.6;

                    // Creamos el elemento interactivo del girasol
                    const flowerInner = document.createElement('div');
                    flowerInner.className = 'flower-inner pointer-events-auto';
                    flowerInner.style.backgroundImage = `url("${encodedSVG}")`;
                    
                    // Habilitar la interacción de corazones
                    flowerInner.addEventListener('mousedown', (e) => spawnHeart(e.clientX, e.clientY));
                    flowerInner.addEventListener('touchstart', (e) => {
                        const touch = e.touches[0];
                        spawnHeart(touch.clientX, touch.clientY);
                    }, {passive: true});

                    wrapper.appendChild(flowerInner);
                    flowerField.appendChild(wrapper);

                    // Hacemos que broten con tiempos aleatorios para que se vea natural (entre 0 y 4 segundos)
                    const growDelay = Math.random() * 4000;
                    setTimeout(() => {
                        wrapper.style.transform = `scale(${scaleFactor})`;
                    }, growDelay);
                }

                // Finalmente, mostrar la foto limpia después de que el campo esté listo
                setTimeout(() => {
                    polaroid.classList.add('show');
                }, 5500); // 5.5 segs de espera para que se asimile el paisaje
            }
        });
    </script>
</body>
</html>
